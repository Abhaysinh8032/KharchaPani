name: kharchaapani
description: KharchaPani - Personal Finance Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Excel Export
  excel: ^4.0.2
  path_provider: ^2.1.3
  share_plus: ^12.0.2

  # CSV Import
  file_picker: ^8.1.2
  csv: ^6.0.0
  permission_handler: ^11.3.1
  # UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
